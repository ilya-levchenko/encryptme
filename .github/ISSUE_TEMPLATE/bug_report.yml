name: Сообщить об ошибке
description: Воспроизводимая проблема EncryptMe
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Не публикуйте пароли, реальные дневники и детали уязвимостей безопасности.
  - type: dropdown
    id: platform
    attributes:
      label: Платформа
      options: [Windows, macOS, Linux, iOS, Browser development]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия EncryptMe
      placeholder: 1.1.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое и фактическое поведение
    validations:
      required: true
