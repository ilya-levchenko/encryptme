ext {
    capacitorVersion = System.getenv('CAPACITOR_VERSION')
}

buildscript {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
    dependencies { classpath 'com.android.tools.build:gradle:8.13.0' }
}

apply plugin: 'com.android.library'

android {
    namespace = "com.encryptme.bluetoothsync"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 26
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
}

repositories { google(); mavenCentral() }
dependencies { implementation project(':capacitor-android') }
